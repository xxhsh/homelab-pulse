<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulse · homelab</title>
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #09090b; --card: #131316; --card2: #18181c; --line: rgba(255,255,255,.06); --line2: rgba(255,255,255,.1);
    --text: #ececef; --dim: #8b8b94; --faint: #55555d;
    --accent: #a5b4fc; --accent-t: rgba(165,180,252,.14);
    --ok: #86efac; --ok-t: rgba(134,239,172,.12); --warn: #fcd34d; --warn-t: rgba(252,211,77,.12);
    --bad: #f87171; --bad-t: rgba(248,113,113,.13);
    --r: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 18px 20px 40px; }

  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 17px; letter-spacing: .2px; }
  .brand svg { width: 34px; height: 20px; }
  .brand .ecg { stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
                stroke-dasharray: 60 140; animation: ecg 2.4s linear infinite; }
  @keyframes ecg { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
  .brand small { color: var(--dim); font-weight: 450; font-size: 13px; }
  .hdr-right { margin-left: auto; display: flex; gap: 18px; align-items: center; color: var(--dim); flex-wrap: wrap; }
  .hdr-right b { color: var(--text); font-weight: 550; }
  .live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .live.on i { background: var(--ok); animation: beat 2s ease-in-out infinite; }
  @keyframes beat { 0%,100% { box-shadow: 0 0 0 0 rgba(134,239,172,.5); } 50% { box-shadow: 0 0 0 5px rgba(134,239,172,0); } }

  .banner { display: none; align-items: center; gap: 10px; border: 1px solid var(--line2); background: var(--card);
            border-radius: 12px; padding: 9px 14px; margin-bottom: 14px; color: var(--dim); font-size: 13px; }
  .banner.show { display: flex; }
  .banner i { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  .banner b { color: var(--text); font-weight: 550; }

  .grid { display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(300px, 1fr); gap: 14px; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
  @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } .wrap { padding: 12px 12px 30px; } .hdr-right { gap: 12px; font-size: 13px; } }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 14px; min-width: 0; }
  .card h2 { font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--dim);
             margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .tag { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .tag { font-size: 11px; color: var(--dim); border: 1px solid var(--line2); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .tag.demo { color: var(--warn); border-color: rgba(252,211,77,.25); }
  .muted { color: var(--dim); }
  .faint { color: var(--faint); }

  /* attention strip */
  .attn { display: none; flex-direction: column; gap: 2px; border: 1px solid var(--line2); background: var(--card);
          border-radius: 12px; padding: 8px 14px; margin-bottom: 14px; font-size: 13px; }
  .attn.show { display: flex; }
  .attn button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .attn button:hover span { text-decoration: underline; text-decoration-color: var(--faint); }
  .attn i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .attn .critical i { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-t); }
  .attn .warning i { background: var(--warn); }
  .attn .muted-item { opacity: .5; }
  .attn small { color: var(--faint); margin-left: auto; white-space: nowrap; }
  .gear { color: var(--dim); text-decoration: none; font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 6px; }
  .gear:hover { color: var(--text); background: var(--card2); }
  .ranges { display: flex; gap: 4px; margin: 12px 0 2px; }
  .ranges button { all: unset; cursor: pointer; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; color: var(--dim);
                   border: 1px solid var(--line); }
  .ranges button.on { color: var(--text); border-color: var(--line2); background: var(--card2); }
  .up7 { color: var(--faint); }

  /* map */
  .mapcard { position: relative; padding: 0; overflow: hidden; }
  .mapcard h2 { position: absolute; left: 16px; top: 14px; z-index: 2; }
  .mapbox { position: relative; }
  #map { display: block; width: 100%; height: auto; }
  #particles { position: absolute; inset: 0; pointer-events: none; }
  .link { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 1.2; }
  .link.down { stroke-dasharray: 3 5; stroke: rgba(255,255,255,.05); }
  .link.bad { stroke: rgba(248,113,113,.35); stroke-dasharray: 3 5; }
  .node { cursor: pointer; outline: none; }
  .node:focus-visible .disc { stroke: var(--accent); stroke-width: 2; }
  .node .disc { fill: var(--card2); stroke: var(--line2); stroke-width: 1; transition: stroke .3s; }
  .node:hover .disc, .node.sel .disc { stroke: rgba(165,180,252,.55); }
  .node .glyph { fill: none; stroke: var(--dim); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke .4s; }
  .node.busy .glyph { stroke: var(--accent); }
  .node .track { fill: none; stroke: rgba(255,255,255,.05); }
  .node .cpu { fill: none; stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray .9s ease, stroke .4s; }
  .node .mem { fill: none; stroke: rgba(236,236,239,.28); stroke-linecap: round; transition: stroke-dasharray .9s ease; }
  .node.busy .cpu { filter: drop-shadow(0 0 5px rgba(165,180,252,.85)); animation: breathe 1.6s ease-in-out infinite; }
  .node.hot .cpu { stroke: var(--warn); filter: drop-shadow(0 0 5px rgba(252,211,77,.8)); }
  @keyframes breathe { 50% { opacity: .55; } }
  .node.off { opacity: .38; }
  .node.off .disc { stroke-dasharray: 3 3; }
  .node .name { fill: var(--text); font-size: 12.5px; font-weight: 560; }
  .node .sub { fill: var(--dim); font-size: 10.5px; }
  .node .dot { stroke: var(--card); stroke-width: 2; }
  .node .svc { stroke: none; }
  .svc.up { fill: rgba(134,239,172,.75); } .svc.down { fill: var(--bad); } .svc.unk { fill: var(--faint); }
  .dot.up { fill: var(--ok); } .dot.down { fill: var(--bad); } .dot.unk { fill: var(--faint); }
  .legend { position: absolute; left: 16px; bottom: 12px; display: flex; gap: 14px; font-size: 11px; color: var(--faint); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }

  /* drawer */
  .drawer { position: absolute; top: 10px; right: 10px; bottom: 10px; width: min(330px, calc(100% - 20px)); z-index: 5;
            background: rgba(15,15,18,.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--line2); border-radius: 16px; padding: 16px; overflow: auto;
            transform: translateX(calc(100% + 20px)); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .drawer.open { transform: none; }
  .drawer .x { position: absolute; right: 10px; top: 8px; background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; padding: 4px 8px; }
  .drawer h3 { margin: 0 0 2px; font-size: 17px; font-weight: 620; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0; font-size: 13px; }
  .kv dt { color: var(--dim); } .kv dd { margin: 0; text-align: right; }
  .spark-block { margin: 14px 0 6px; }
  .spark-block .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .spark-block svg { width: 100%; height: 46px; display: block; }

  /* host */
  .big { font-size: 30px; font-weight: 600; letter-spacing: -.5px; line-height: 1.1; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .bar { height: 5px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; margin: 5px 0 10px; }
  .bar i { display: block; height: 100%; background: rgba(236,236,239,.45); border-radius: 4px; transition: width .8s ease; }
  .bar.hi i { background: var(--warn); }
  .sect { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .mini { font-size: 12.5px; }
  .hostSpark { width: 100%; height: 54px; display: block; margin: 8px 0 12px; }
  .nodeblk + .nodeblk { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line2); }
  .nodeblk h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .nodeblk.off { opacity: .5; }
  .grp { font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--faint); margin: 12px 0 2px; }
  .grp:first-child { margin-top: 0; }
  #svcBody { max-height: 460px; overflow: auto; }

  /* lists */
  .list { display: flex; flex-direction: column; }
  .item { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .item:first-child { border-top: 0; }
  .item .s { width: 8px; height: 8px; border-radius: 50%; }
  .s.up { background: var(--ok); } .s.down { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-t); } .s.unk { background: var(--faint); }
  .item .d { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lat { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 12px; }
  .lat svg { width: 46px; height: 16px; }

  .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px;
          background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-t); border-color: transparent; }

  /* backups */
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 10px; }
  .chip { border-radius: 10px; padding: 6px 8px; background: var(--card2); border: 1px solid var(--line); font-size: 11.5px; min-width: 0; }
  .chip b { display: block; font-weight: 560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip span { color: var(--dim); }
  .chip.fresh { border-color: rgba(134,239,172,.16); }
  .chip.fresh span { color: var(--ok); }
  .chip.stale span { color: var(--warn); }

  /* activity */
  .ev { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 13px; border-top: 1px solid var(--line); }
  .ev:first-child { border-top: 0; }
  .ev i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transform: translateY(-1px); }
  .ev.ok i { background: var(--ok); } .ev.bad i { background: var(--bad); } .ev.warn i { background: var(--warn); } .ev.info i { background: var(--accent); }
  .ev time { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
  #events { max-height: 330px; overflow: auto; }

  /* ?embed: inside Home Assistant's Proxmox dashboard, which has its own header */
  body.embed header, body.embed footer { display: none; }
  body.embed .wrap { padding: 4px 4px 16px; }
  body.embed .banner { margin-bottom: 10px; }
  footer { margin-top: 16px; color: var(--faint); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  footer .err { color: var(--bad); }
</style>
</head>

<div class="wrap">

      <svg viewBox="0 0 68 40" aria-hidden="true"><path d="M2 22 H20 L25 10 L31 32 L36 4 L41 26 L45 22 H66" fill="none" stroke="rgba(165,180,252,.22)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><path class="ecg" d="M2 22 H20 L25 10 L31 32 L36 4 L41 26 L45 22 H66"/></svg>
      Pulse <small id="nodeName">homelab</small>

  <div class="banner" id="banner"><i></i><span id="bannerText"></span></div>
  <div class="attn" id="attention" aria-live="polite"></div>

  <div class="grid">
    <section class="card mapcard">
      <h2>Live map <span class="tag" id="mapTag" style="display:none"></span></h2>

        <svg id="map" role="img" aria-label="Network map of the homelab"></svg>

        <div class="legend"><span><i style="background:var(--accent)"></i>CPU</span><span><i style="background:rgba(236,236,239,.35)"></i>memory</span><span><i style="background:linear-gradient(90deg,var(--accent),rgba(236,236,239,.6))"></i>traffic in / out</span></div>
      </div>

      <h2 id="hostTitle">Proxmox host <span class="tag" id="hostTag"></span></h2>
      <div id="hostBody" class="muted">Waiting for data…</div>
    </section>
  </div>

  <div class="cards">
    <section class="card"><h2>Services <span class="tag" id="svcTag"></span></h2><div id="svcBody" class="list"></div></section>
    <section class="card"><h2>Backups <span class="tag" id="bkTag"></span></h2><div id="bkBody" class="muted">Waiting for data…</div></section>
    <section class="card"><h2>Activity <span class="tag">last 24 h</span></h2><div id="events" class="muted">Nothing yet.</div></section>
  </div>

  <footer id="footer"></footer>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- formatting ---------- */
const fmtBytes = (b) => { if (!b) return "0 B"; const u = ["B", "KB", "MB", "GB", "TB"]; const i = Math.min(4, Math.floor(Math.log(b) / Math.log(1024)));
  const v = b / 1024 ** i; return `${v >= 100 || i === 0 ? v.toFixed(0) : v.toFixed(1)} ${u[i]}`; };
const fmtRate = (Bps) => { const b = (Bps || 0) * 8; if (b < 1000) return `${b.toFixed(0)} b/s`; if (b < 1e6) return `${(b / 1e3).toFixed(b < 1e4 ? 1 : 0)} kb/s`;
  if (b < 1e9) return `${(b / 1e6).toFixed(b < 1e7 ? 1 : 0)} Mb/s`; return `${(b / 1e9).toFixed(1)} Gb/s`; };
const pct = (x) => `${Math.round((x || 0) * 100)}%`;
const fmtUp = (s) => { if (!s) return "—"; const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`; };
const ago = (ts, now) => { if (!ts) return "never"; const s = Math.max(0, (now || Date.now() / 1000) - ts);
  if (s < 45) return "just now"; if (s < 3600) return `${Math.round(s / 60)} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`; };
const clockOf = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const deg = (v) => v == null ? "—" : `${Math.round(v)}°`;

/* ---------- glyphs (24x24 stroke icons) ---------- */
const GLYPH = {
  camera: "M4 8h3l2-2h6l2 2h3v10H4z M12 16a3 3 0 1 0 0-6 3 3 0 0 0 0 6",

};

/* ---------- state ---------- */
let S = null;                  // latest snapshot
let selected = null;           // selected node key
let lastMsg = 0;
let mapKey = "";               // node set + orientation; rebuild the SVG when it changes
let geom = { W: 1000, H: 620, nodes: {}, links: [] };
let range = "live";            // drawer history range: live (in memory) or an RRD range from Proxmox
let U = {};                    // uptime per check id, from /api/uptime

/* ---------- map layout ---------- */
// Keys: "internet", "router", "node:<name>" for Proxmox nodes, the VMID (number) for guests.
const nodeKey = (name) => `node:${name}`;

    W = 420;

    let y = 225;

    l.p2 = { x: b.x - dx / len * b.r, y: b.y - dy / len * b.r };
    l.p1 = { x: mx - dy * bow, y: my + dx * bow };

    if (portrait && l.from === "router" && l.to !== nodeKey(groups[0]?.name)) l.p1 = { x: 2 * (W - 16) - a.x, y: my };

    n.mem = el("circle", { class: "mem", r: rm, "stroke-width": 1.5, transform: "rotate(-90)", "stroke-dasharray": `0 ${2 * Math.PI * rm}` }, g);

    n.sub.textContent = g.running ? (g.cpu > 0.5 ? `${g.role} · working ${pct(g.cpu)}` : g.role) : `${g.role} · stopped`;
    setDot(g.vmid, g.vmid);

    const nd = typeof l.key === "string" && l.key.startsWith("node:") ? S.nodes.find((x) => nodeKey(x.name) === l.key) : null;
    const h = healthOf(g ? g.vmid : nd ? nd.name : l.key);
    l.elem.setAttribute("class", "link" + ((g && !g.running) || (nd && !nd.online) ? " down" : h === "down" ? " bad" : ""));

/* ---------- particles ---------- */
const cv = $("particles"), cx = cv.getContext("2d");

}
function nodeBlock(n, multi) {
  if (!n.online) return `<div class="nodeblk off"><h4>${esc(n.name)} <span class="tag">offline</span></h4></div>`;
  const guests = S.guests.filter((g) => g.node === n.name), running = guests.filter((g) => g.running).length;
  const memf = n.mem / (n.maxmem || 1);
  const disks = n.disks.map((d) => { const okh = /PASSED|OK/i.test(d.health);
    return `<div class="row mini" style="padding:3px 0"><span>${esc(d.model)} <span class="faint">${esc(d.type.toUpperCase())}</span></span><span class="${okh ? "muted" : ""}" style="${okh ? "" : "color:var(--bad)"}">${okh ? "healthy" : esc(d.health)}${d.wear_used != null ? ` · ${d.wear_used}% worn` : ""}</span></div>`; }).join("");
  return `<div class="nodeblk">${multi ? `<h4>${esc(n.name)} <span class="faint" style="font-weight:450">${esc(n.ip || "")}</span>${n.error ? ` <span style="color:var(--bad);font-weight:450">${esc(n.error)}</span>` : ""}</h4>` : ""}
    <div class="row"><div><div class="big num">${pct(n.cpu)}</div><div class="muted mini">CPU · ${n.cpus} threads</div></div>
      <div style="text-align:right"><div class="big num">${fmtBytes(n.mem).replace(" ", "<small style='font-size:15px;color:var(--dim)'> ")}</small></div><div class="muted mini">of ${fmtBytes(n.maxmem)} RAM</div></div></div>
    <div class="hostSpark">${sparkSvg(n.cpu_history, { w: 300, h: 54, max: Math.max(0.25, ...n.cpu_history), id: "hs" + n.name.replace(/\W/g, "") })}</div>
    <div class="bar"><i style="width:${(memf * 100).toFixed(1)}%"></i></div>
    <div class="row mini muted"><span>${running} of ${guests.length} guests running</span><span class="num">load ${n.load.map((x) => x.toFixed(2)).join(" ")}</span></div>
    <div class="row mini muted"><span>up ${fmtUp(n.uptime)}</span><span>${esc(n.model.replace(/\(R\)|\(TM\)| CPU/g, ""))}</span></div>
    ${n.storage.length ? `<div class="sect">${storageRows(n.storage)}</div>` : ""}
    ${disks ? `<div class="sect">${disks}</div>` : ""}</div>`;
}
function renderHost() {
  const src = S.sources.pve, multi = S.nodes.length > 1, pve = S.nodes.find((n) => n.pve)?.pve;
  $("hostTitle").firstChild.textContent = !multi ? "Proxmox host " : S.clustered === false ? `Proxmox hosts · ${S.nodes.length} ` : `Proxmox cluster · ${S.nodes.length} nodes `;
  $("hostTag").outerHTML = `<span id="hostTag" class="tag${src.mode === "demo" ? " demo" : ""}">${src.mode === "demo" ? "demo data" : (pve ? `PVE ${esc(pve)}` : "")}</span>`;
  if (!S.nodes.length) { $("hostBody").innerHTML = `<span class="muted">${esc(src.error || "Waiting for Proxmox…")}</span>`; return; }
  const shared = (S.shared_storage || []).length ? `<div class="nodeblk"><h4>Shared storage</h4>${storageRows(S.shared_storage)}</div>` : "";
  $("hostBody").innerHTML = S.nodes.map((n) => nodeBlock(n, multi)).join("") + shared;
}

function renderServices() {
  const ps = S.probes || [];
  const live = ps.filter((p) => !p.paused), down = live.filter((p) => p.up === false).length;
  $("svcTag").textContent = ps.length ? (down ? `${down} down` : `${live.filter((p) => p.up).length}/${live.length} up`) : "";
  $("svcTag").style.color = down ? "var(--bad)" : "";
  const row = (p) => {
    const h = p.history.slice(-20), m = Math.max(5, ...h.filter((x) => x != null));
    const bars = h.map((v, i) => v == null ? `<rect x="${i * 2.4}" y="2" width="1.6" height="14" fill="#f87171" opacity=".7"/>`
      : `<rect x="${i * 2.4}" y="${16 - Math.max(1.5, v / m * 14)}" width="1.6" height="${Math.max(1.5, v / m * 14)}" fill="#8b8b94" opacity=".55"/>`).join("");
    return `<div class="item"><span class="s ${stateOf(p)}"></span>
      <div style="min-width:0">${esc(p.name)}${p.port && p.source !== "builtin" ? ` <span class="faint">:${p.port}</span>` : ""}<div class="d">${upTxt(p.id)}${esc(p.detail)}${p.up === false && p.since ? " · " + ago(p.since, S.now) : ""}${p.source === "discovered" ? ' · <span class="faint">auto</span>' : ""}</div></div>
      <div class="lat num"><svg viewBox="0 0 48 16">${bars}</svg><span style="min-width:44px;text-align:right">${p.latency_ms != null && !p.paused ? (p.latency_ms < 10 ? p.latency_ms.toFixed(1) : Math.round(p.latency_ms)) + " ms" : "—"}</span></div></div>`;
  };
  const names = Object.fromEntries(S.guests.map((g) => [g.vmid, g.name]));
  const groups = new Map([["Network & Proxmox", []]]);
  for (const p of ps) {
    const label = typeof p.target === "number" ? (names[p.target] || p.guest || `#${p.target}`) : "Network & Proxmox";
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(p);
  }
  $("svcBody").innerHTML = [...groups].filter(([, v]) => v.length)
    .map(([label, v]) => `<div class="grp">${esc(label)}</div>${v.map(row).join("")}`).join("") || '<span class="muted">Discovering services…</span>';
}

function renderBackups() {
  const b = S.backups, src = S.sources.pve;
  if (!b) { $("bkBody").innerHTML = '<span class="muted">Waiting for Proxmox…</span>'; return; }
  const lr = b.last_run;
  $("bkTag").outerHTML = `<span id="bkTag" class="tag${src.mode === "demo" ? " demo" : ""}">${src.mode === "demo" ? "demo data" : "vzdump"}</span>`;
  const total = b.guests.length;
  const head = lr ? `<div class="row"><div><div class="big num" style="color:${lr.ok ? "var(--text)" : "var(--bad)"}">${b.fresh}<span class="muted" style="font-size:17px">/${total}</span></div>
      <div class="muted mini">guests backed up in the last day</div></div>
      <div style="text-align:right" class="mini"><span class="pill ${lr.ok ? "ok" : ""}" style="${lr.ok ? "" : "color:var(--bad)"}">${lr.ok ? "last run OK" : esc(lr.status)}</span>
      <div class="muted" style="margin-top:6px">${lr.start ? `${new Date(lr.start * 1000).toLocaleDateString([], { weekday: "short" })} ${clockOf(lr.start)}` : ""}${lr.end ? ` · ${Math.round((lr.end - lr.start) / 60)} min` : ""}</div></div></div>`
    : '<div class="muted">No backup runs found.</div>';
  const chips = b.guests.map((g) => `<div class="chip ${g.fresh ? "fresh" : g.ts || g.error ? "stale" : ""}"${g.error ? ` title="${esc(g.error)}"` : ""}><b>${esc(g.name)}</b><span>${g.error ? "failed" : g.ts ? ago(g.ts, S.now) : "not yet"}</span></div>`).join("");
  const perNode = b.runs.length > 1 ? `<div class="mini muted" style="margin-top:8px">${b.runs.map((r) => `${esc(r.node)}: <span style="color:${r.ok ? "var(--ok)" : "var(--bad)"}">${r.ok ? "OK" : esc(r.status)}</span>`).join(" · ")}</div>` : "";
  $("bkBody").innerHTML = `${head}${perNode}<div class="chips">${chips}</div><div class="muted mini" style="margin-top:10px">${fmtBytes(b.total_bytes)} in the latest set</div>`;
}

function renderEvents() {
  const ev = S.events || [];
  $("events").innerHTML = ev.length ? ev.map((e) => `<div class="ev ${esc(e.level)}"><i></i><span>${esc(e.text)}</span><time class="num">${ago(e.ts, S.now)}</time></div>`).join("")
    : '<span class="muted">Quiet. Nothing happened in the last day.</span>';
}

function renderChrome() {
  const src = S.sources, demo = src.pve.mode === "demo";
  $("nodeName").textContent = S.nodes.length === 1 ? `${S.nodes[0].name} · homelab` : S.nodes.length ? `${S.nodes.length} nodes · homelab` : "homelab";
  $("banner").classList.toggle("show", demo);
  $("bannerText").innerHTML = demo ? "<b>Demo mode:</b> a simulated two-node cluster (PULSE_PVE=demo). Set PULSE_PVE=live to watch your own lab." : "";
  $("mapTag").style.display = src.pve.mode === "demo" ? "" : "none"; $("mapTag").className = "tag demo"; $("mapTag").textContent = "demo data";
  const parts = Object.entries(src).map(([k, s]) => {
    const label = { pve: "Proxmox", probes: "Health checks", discovery: "Discovery", store: "History", alerts: "Alerts" }[k] || k;
    return `${label}: ${s.mode}${s.ok === false ? ` <span class="err">— ${esc(s.error)}</span>` : s.updated ? ` · ${ago(s.updated, S.now)}` : ""}`;
  });
  $("footer").innerHTML = parts.map((p) => `<span>${p}</span>`).join("");
}

function render() {
  if (!S) return;
  try { updateMap(); } catch (e) { console.error(e); }
  for (const f of [renderAttention, renderHost, renderServices, renderBackups, renderEvents, renderChrome]) {
    try { f(); } catch (e) { console.error(f.name, e); }
  }
  if (selected != null) renderDrawer();
}

/* ---------- live connection ---------- */
function setLive(on, text) { $("live").classList.toggle("on", on); $("live").lastElementChild.textContent = text; }
function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = (m) => { S = JSON.parse(m.data); lastMsg = Date.now(); setLive(true, "live"); render(); };
  es.onerror = () => setLive(false, "reconnecting");
}
setInterval(() => {
  $("clock").textContent = new Date().toLocaleTimeString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  if (lastMsg && Date.now() - lastMsg > 30000) setLive(false, "stale");
}, 1000);
fetch("/api/state").then((r) => r.json()).then((s) => { if (!S) { S = s; render(); } }).catch(() => {});
connect();
</script>
</body>
</html>
